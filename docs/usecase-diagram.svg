<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1300" width="100%" height="100%" style="background:#ffffff; font-family:'Cairo', 'Segoe UI', Tahoma, sans-serif;">
  <defs>
    <!-- رأس السهم لعلاقات include و extend -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <!-- رأس سهم الوراثة (مثلث مفرغ) -->
    <marker id="generalization" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="1 2, 13 7, 1 12" fill="#ffffff" stroke="#059669" stroke-width="1.8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- الترويسة الرئيسية -->
  <text x="575" y="42" text-anchor="middle" font-size="22" font-weight="900" fill="#0f172a">مخطط حالات الاستخدام القياسي (UML 2.5 Use Case Diagram)</text>
  <text x="575" y="68" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">منصة مزايد للمزادات والضمان المالي (A4 Standard - نموذج الـ 3 أكتورز المنفصل)</text>

  <!-- ==================== إطار حدود النظام (System Boundary) ==================== -->
  <rect x="250" y="90" width="650" height="1160" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="2.5" stroke-dasharray="7,5" />
  <rect x="280" y="76" width="310" height="28" rx="6" fill="#1e293b" />
  <text x="435" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f8fafc">نظام منصة مزايد (Mozaid Platform)</text>


  <!-- ==================== 1. الزائر (Guest / Visitor) ==================== -->
  <g id="actor-guest" transform="translate(115, 210)">
    <circle cx="0" cy="0" r="18" fill="#f1f5f9" stroke="#0284c7" stroke-width="2.8" />
    <line x1="0" y1="18" x2="0" y2="60" stroke="#0284c7" stroke-width="2.8" stroke-linecap="round" />
    <line x1="-26" y1="34" x2="26" y2="34" stroke="#0284c7" stroke-width="2.8" stroke-linecap="round" />
    <line x1="0" y1="60" x2="-22" y2="102" stroke="#0284c7" stroke-width="2.8" stroke-linecap="round" />
    <line x1="0" y1="60" x2="22" y2="102" stroke="#0284c7" stroke-width="2.8" stroke-linecap="round" />
    <text x="0" y="126" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">الـزائـر</text>
    <text x="0" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">(Guest / Visitor)</text>
  </g>

  <!-- خطوط ارتباط الزائر -->
  <line x1="150" y1="230" x2="385" y2="160" stroke="#0284c7" stroke-width="1.8" />
  <line x1="150" y1="245" x2="385" y2="230" stroke="#0284c7" stroke-width="1.8" />
  <line x1="150" y1="260" x2="385" y2="300" stroke="#0284c7" stroke-width="1.8" />

  <!-- حالات الزائر (Use Cases) -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="160" rx="125" ry="25" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <text x="510" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">تصفح المزادات والمناقصات (Browse)</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="510" cy="230" rx="125" ry="25" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <text x="510" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">البحث والتصفية (Search &amp; Filter)</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="510" cy="300" rx="125" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="510" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">التسجيل ودخول الحساب (Register/Login)</text>
  </g>


  <!-- ==================== 2. المستخدم المسجل (Registered User) ==================== -->
  <g id="actor-user" transform="translate(115, 650)">
    <circle cx="0" cy="0" r="18" fill="#f0fdf4" stroke="#059669" stroke-width="2.8" />
    <line x1="0" y1="18" x2="0" y2="60" stroke="#059669" stroke-width="2.8" stroke-linecap="round" />
    <line x1="-26" y1="34" x2="26" y2="34" stroke="#059669" stroke-width="2.8" stroke-linecap="round" />
    <line x1="0" y1="60" x2="-22" y2="102" stroke="#059669" stroke-width="2.8" stroke-linecap="round" />
    <line x1="0" y1="60" x2="22" y2="102" stroke="#059669" stroke-width="2.8" stroke-linecap="round" />
    <text x="0" y="126" text-anchor="middle" font-size="14" font-weight="800" fill="#047857">المستخدم المسجل</text>
    <text x="0" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">(User: بائع ومشتري)</text>
  </g>

  <!-- سهم الوراثة الأنيق من المستخدم إلى الزائر -->
  <line x1="115" y1="630" x2="115" y2="370" stroke="#059669" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#generalization)" />
  <text x="90" y="500" text-anchor="middle" font-size="10" font-weight="800" fill="#059669" transform="rotate(-90 90 500)">&lt;&lt;inherits&gt;&gt; يرث صلاحيات الزائر</text>

  <!-- خطوط ارتباط المستخدم المسجل -->
  <line x1="150" y1="640" x2="385" y2="390" stroke="#059669" stroke-width="1.8" />
  <line x1="150" y1="655" x2="385" y2="465" stroke="#059669" stroke-width="1.8" />
  <line x1="150" y1="670" x2="385" y2="540" stroke="#059669" stroke-width="1.8" />
  <line x1="150" y1="685" x2="385" y2="675" stroke="#059669" stroke-width="1.8" />
  <line x1="150" y1="700" x2="385" y2="750" stroke="#059669" stroke-width="1.8" />
  <line x1="150" y1="715" x2="385" y2="895" stroke="#059669" stroke-width="1.8" />

  <!-- حالات المستخدم المسجل (تم حذف فكرة التوثيق) -->
  <!-- UC-04 -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="390" rx="125" ry="25" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <text x="510" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">إدارة الحساب والملف (Manage Profile)</text>
  </g>

  <!-- UC-05 -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="465" rx="125" ry="25" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <text x="510" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">إدارة المحفظة والضمان (Wallet &amp; Escrow)</text>
  </g>

  <!-- UC-06: المزايدة وتقديم العروض -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="540" rx="125" ry="26" fill="#ecfdf5" stroke="#059669" stroke-width="2.4" />
    <text x="510" y="545" text-anchor="middle" font-size="12" font-weight="800" fill="#065f46">المزايدة وتقديم العروض (Submit Bid/Offer)</text>
  </g>

  <!-- UC-06b: Include حجز تأمين المزايدة -->
  <g filter="url(#shadow)">
    <ellipse cx="765" cy="495" rx="110" ry="22" fill="#f8fafc" stroke="#475569" stroke-width="1.8" stroke-dasharray="4,3" />
    <text x="765" y="499" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">حجز مبلغ التأمين (Hold Deposit)</text>
  </g>
  <path d="M 610 525 L 675 508" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="655" y="532" text-anchor="middle" font-size="9" font-weight="800" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-06c: Extend تمديد وقت المزاد -->
  <g filter="url(#shadow)">
    <ellipse cx="765" cy="585" rx="110" ry="22" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,3" />
    <text x="765" y="589" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">تمديد المزاد (Extend Time)</text>
  </g>
  <path d="M 670 572 L 615 555" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="655" y="560" text-anchor="middle" font-size="9" font-weight="800" fill="#b45309">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC-07: طرح مزاد أو مناقصة مباشرة بدون توثيق -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="675" rx="125" ry="25" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <text x="510" y="680" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">طرح مزاد أو مناقصة (Publish Listing)</text>
  </g>

  <!-- UC-08: المعاينة والاستلام بالضمان -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="750" rx="125" ry="25" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <text x="510" y="755" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">معاينة واستلام السلعة (Inspect - 48h)</text>
  </g>

  <!-- UC-08b: Extend فتح نزاع تحكيمي -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="820" rx="125" ry="24" fill="#fff1f2" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,3" />
    <text x="510" y="825" text-anchor="middle" font-size="12" font-weight="700" fill="#9f1239">فتح نزاع تحكيمي (Open Dispute)</text>
  </g>
  <path d="M 510 795 L 510 778" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="548" y="790" text-anchor="middle" font-size="9" font-weight="800" fill="#be123c">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC-09: المفضلة والتقييم -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="895" rx="125" ry="25" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <text x="510" y="900" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">المفضلة وتقييم التعامل (Watchlist &amp; Rate)</text>
  </g>


  <!-- ==================== 3. مدير النظام (Platform Admin - جهة رقابية مستقلة) ==================== -->
  <g id="actor-admin" transform="translate(1040, 770)">
    <circle cx="0" cy="0" r="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.8" />
    <line x1="0" y1="18" x2="0" y2="60" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" />
    <line x1="-26" y1="34" x2="26" y2="34" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" />
    <line x1="0" y1="60" x2="-22" y2="102" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" />
    <line x1="0" y1="60" x2="22" y2="102" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" />
    <text x="0" y="126" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">مدير النظام</text>
    <text x="0" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">(Platform Admin)</text>
  </g>

  <!-- خطوط ارتباط مدير النظام كجهة إشرافية مستقلة -->
  <line x1="1000" y1="740" x2="635" y2="165" stroke="#ea580c" stroke-width="1.8" />
  <line x1="1000" y1="760" x2="635" y2="820" stroke="#ea580c" stroke-width="1.8" />
  <line x1="1000" y1="780" x2="635" y2="980" stroke="#ea580c" stroke-width="1.8" />
  <line x1="1000" y1="800" x2="635" y2="1055" stroke="#ea580c" stroke-width="1.8" />
  <line x1="1000" y1="820" x2="635" y2="1130" stroke="#ea580c" stroke-width="1.8" />
  <line x1="1000" y1="840" x2="635" y2="1205" stroke="#ea580c" stroke-width="1.8" />

  <!-- حالات مدير النظام -->
  <!-- UC-10 -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="980" rx="130" ry="25" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <text x="510" y="985" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">إدارة حسابات المشتركين (Manage Users)</text>
  </g>

  <!-- UC-11 -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="1055" rx="130" ry="25" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <text x="510" y="1060" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">إدارة المزادات والمناقصات (Listings)</text>
  </g>

  <!-- UC-12 -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="1130" rx="130" ry="25" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <text x="510" y="1135" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">تدقيق السندات والعمولات (Finance Audit)</text>
  </g>

  <!-- UC-13 -->
  <g filter="url(#shadow)">
    <ellipse cx="510" cy="1205" rx="130" ry="25" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <text x="510" y="1210" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">مراقبة الأمان ومكافحة التلاعب (Security)</text>
  </g>

  <!-- تذييل القياس -->
  <text x="575" y="1275" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">المخطط القياسي UML 2.5 • فصل الصلاحيات والرقابة • قياس الصفحة: A4 Standard</text>
</svg>
